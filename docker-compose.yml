version: "3.8"

services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    expose:
      - "11434"
    networks:
      - backend

  api:
    build: ./api
    container_name: express-api
    ports:
      - "5000:5000"
    environment:
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      - ollama
    networks:
      - backend

networks:
  backend:
    driver: bridge
